# Статический сайт для OAuth consent screen (YT / YouTube upload).
# Подставьте DOMAIN при установке: ./scripts/setup_yt_oauth_web.sh yt-oauth.example.com

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /home/appuser/dev/kostya/avatar_kostya/www/yt-oauth;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|css|js|ico|txt)$ {
        add_header Cache-Control "public, max-age=300";
    }
}
