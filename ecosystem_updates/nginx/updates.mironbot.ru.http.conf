# HTTP-only шаблон. DOMAIN подставляется setup-скриптом.
# После certbot появятся listen 443 и редирект с :80.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /home/appuser/dev/kostya/ecosystem_updates/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|css|js|ico|txt)$ {
        add_header Cache-Control "public, max-age=120";
    }
}
